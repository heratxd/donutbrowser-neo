name: NeoDonut Community PR Checks

on:
  pull_request:
    branches: ["community"]
  merge_group:
    branches: ["community"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  lint-js:
    name: Lint JavaScript/TypeScript
    uses: ./.github/workflows/lint-js.yml
    secrets: inherit
    permissions:
      contents: read

  lint-rust:
    name: Lint and test Rust
    uses: ./.github/workflows/lint-rs.yml
    secrets: inherit
    permissions:
      contents: read

  spellcheck:
    name: Spell check
    uses: ./.github/workflows/spellcheck.yml
    secrets: inherit
    permissions:
      contents: read

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    secrets: inherit
    permissions:
      security-events: write
      contents: read
      packages: read
      actions: read

  security-scan:
    name: Dependency vulnerability scan
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2" # v2.3.8
    with:
      scan-args: |-
        -r
        --skip-git
        --lockfile=pnpm-lock.yaml
        --lockfile=src-tauri/Cargo.lock
        ./
    permissions:
      security-events: write
      contents: read
      actions: read

  status:
    name: Community PR status
    runs-on: ubuntu-latest
    needs: [lint-js, lint-rust, spellcheck, codeql, security-scan]
    if: always()
    steps:
      - name: Require every check to pass
        shell: bash
        run: |
          results=(
            "${{ needs.lint-js.result }}"
            "${{ needs.lint-rust.result }}"
            "${{ needs.spellcheck.result }}"
            "${{ needs.codeql.result }}"
            "${{ needs.security-scan.result }}"
          )
          printf 'check result: %s\n' "${results[@]}"
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "At least one required community check did not succeed."
              exit 1
            fi
          done
