name: Sync clean upstream main

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fast-forward-main:
    if: github.repository == 'paracosm17/donutbrowser-neo'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork main branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        shell: bash
        run: |
          git remote add upstream https://github.com/zhom/donutbrowser.git
          git fetch origin main
          git fetch upstream main

      - name: Refuse divergent main branches
        shell: bash
        run: |
          if ! git merge-base --is-ancestor origin/main upstream/main; then
            echo "Fork main contains commits that are not a clean ancestor of upstream/main."
            echo "No branch was modified. Resolve the divergence manually."
            exit 1
          fi

      - name: Fast-forward only the clean main mirror
        shell: bash
        run: git push origin upstream/main:main
